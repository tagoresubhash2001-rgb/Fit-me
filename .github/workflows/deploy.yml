name: Deploy to Firebase

# How deployments work (details: docs/DEPLOY.md)
# - Push to `ccr-e653337b-g4rwtg` (default branch) or `main` -> deploy to dev (Firebase project fit-me1).
#   Hosting deploys in its own job, so the website goes live even if a backend job fails.
#   Backend order: Firestore rules + indexes -> Storage rules -> Cloud Functions, then smoke tests.
# - Pull request into `main`       -> temporary Hosting preview on fit-me1 (expires after 7 days),
#   link posted on the PR.
# - Actions -> "Run workflow"      -> dev now; staging and production are listed but refuse to run
#   until those Firebase projects exist (see docs/DEPLOY.md, "Not set up yet").
#
# Authentication: keyless Workload Identity Federation. GitHub exchanges its OIDC token for short-lived
# credentials of the deploy service account; only this repository is allowed. No key is stored in GitHub.
# Fallback: if the repository or environment secret FIREBASE_SERVICE_ACCOUNT (a service-account JSON)
# exists, it is used instead.

on:
  push:
    # ccr-e653337b-g4rwtg is the repository's default branch; main is kept for older pull requests.
    branches: [main, ccr-e653337b-g4rwtg]
  pull_request:
    branches: [main, ccr-e653337b-g4rwtg]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [dev, staging, production]
        default: dev

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || inputs.target || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # dev = fit-me1. Staging and production projects are not created yet.
  FIREBASE_PROJECT: fit-me1
  WIF_PROVIDER: projects/216212194424/locations/global/workloadIdentityPools/github/providers/fit-me
  DEPLOY_SERVICE_ACCOUNT: firebase-adminsdk-fbsvc@fit-me1.iam.gserviceaccount.com
  SITE_URL: https://fit-me1.web.app
  HEALTH_URL: https://asia-south1-fit-me1.cloudfunctions.net/healthCheck
  FORCE_COLOR: '0'

jobs:
  guard:
    name: Check target
    runs-on: ubuntu-latest
    steps:
      - name: Staging and production are not set up yet
        if: inputs.target == 'staging' || inputs.target == 'production'
        run: |
          echo "::error::The ${{ inputs.target }} Firebase project does not exist yet. Only dev (fit-me1) can be deployed. See docs/DEPLOY.md."
          exit 1
      - run: echo "Deploying to dev (fit-me1)."

  # What changed in this push (a manual run deploys everything). Each part deploys only when its files changed,
  # and only the Cloud Functions whose code changed are deployed: every function deploy builds a new container
  # image, so redeploying all of them on every push wastes Cloud Build time and Artifact Registry storage.
  changes:
    name: Detect changes
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      hosting: ${{ steps.d.outputs.hosting }}
      workflow: ${{ steps.d.outputs.workflow }}
      firestore: ${{ steps.d.outputs.firestore }}
      storage: ${{ steps.d.outputs.storage }}
      functions: ${{ steps.d.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: d
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            FILES="__all__"
          elif [ "$EVENT" = "pull_request" ]; then
            FILES=$(git diff --name-only "$PR_BASE" HEAD)
          else
            FILES=$(git diff --name-only "$BEFORE" HEAD)
          fi
          BASE=$([ "$EVENT" = "pull_request" ] && echo "$PR_BASE" || echo "$BEFORE"); export BASE
          echo "Changed files:"; echo "$FILES"
          has() { [ "$FILES" = "__all__" ] || echo "$FILES" | grep -qE "$1"; }
          has '^(src/|public/|index\.html|vite\.config\.ts|package(-lock)?\.json|firebase\.json|tsconfig|e2e/render-check|deploy/)' && echo "hosting=true" >> "$GITHUB_OUTPUT" || echo "hosting=false" >> "$GITHUB_OUTPUT"
          has '^(firestore\.rules|firestore\.indexes\.json)$' && echo "firestore=true" >> "$GITHUB_OUTPUT" || echo "firestore=false" >> "$GITHUB_OUTPUT"
          has '^storage\.rules$' && echo "storage=true" >> "$GITHUB_OUTPUT" || echo "storage=false" >> "$GITHUB_OUTPUT"
          has '^\.github/workflows/deploy\.yml$' && echo "workflow=true" >> "$GITHUB_OUTPUT" || echo "workflow=false" >> "$GITHUB_OUTPUT"
          if [ "$FILES" = "__all__" ]; then FN=ALL; else FN=$(node scripts/changed-functions.mjs $FILES); fi
          echo "Functions to deploy: ${FN:-none}"
          echo "functions=$FN" >> "$GITHUB_OUTPUT"

  verify:
    name: Lint, test and build check
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: 'package-lock.json' }
      - run: npm ci
      - run: npm run lint
      - run: npm test

  hosting:
    name: Hosting (website)
    needs: [verify, changes]
    if: github.event_name == 'pull_request' || needs.changes.outputs.hosting == 'true'
    runs-on: ubuntu-latest
    environment: dev
    env:
      HAS_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    permissions:
      contents: read
      id-token: write        # Workload Identity Federation
      pull-requests: write   # preview link comment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Web config for dev
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
        run: node deploy/write-web-env.mjs dev
      - run: npm run build
      - name: Production build must not point at the emulators
        run: |
          if grep -q "VITE_USE_EMULATORS=true" .env.production.local; then echo "::error::Emulators enabled in a deploy build"; exit 1; fi
          if grep -rq "127.0.0.1:9099\|127.0.0.1:8080" dist/assets/; then echo "::error::Emulator hosts found in the deploy bundle"; exit 1; fi
          grep -q '"fit-me1"\|fit-me1.firebaseapp.com' -r dist/assets/ || { echo "::error::fit-me1 web config missing from the bundle"; exit 1; }
      - name: Install browser for render checks
        run: npx playwright install --with-deps chromium
      - name: Render check (built site, before deploy)
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173 >/dev/null && break; sleep 1; done
          node e2e/render-check.cjs http://localhost:4173
      - &auth_sa
        name: Authenticate (service-account key fallback)
        if: env.HAS_SA_KEY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - &auth_wif
        name: Authenticate (Workload Identity Federation)
        if: env.HAS_SA_KEY != 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy preview channel (pull request)
        if: github.event_name == 'pull_request'
        id: preview
        run: |
          npx firebase hosting:channel:deploy "pr-${{ github.event.number }}" \
            --project "$FIREBASE_PROJECT" --expires 7d --json > preview.json
          url=$(node -e "const r=require('./preview.json');const v=Object.values(r.result||{})[0];console.log(v&&v.url||'')")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Post preview link on the PR
        if: github.event_name == 'pull_request' && steps.preview.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview.outputs.url }}';
            const body = `Preview for this PR (expires in 7 days): ${url}\n\nCommit ${context.sha.slice(0, 7)}.`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const old = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith('Preview for this PR'));
            if (old) await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

      # The APK is no longer kept in git (public/downloads/*.apk is ignored). New releases are uploaded from
      # Admin -> Releases to Storage releases/. This one-time step moves the last APK that was committed
      # (it is still in git history) to Storage if releases/ has none yet, so /download/android keeps working.
      - name: Make sure an APK is in Storage releases/
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || 'fit-me1.firebasestorage.app' }}
        run: |
          if gcloud storage ls "gs://$BUCKET/releases/*.apk" >/dev/null 2>&1; then echo "Storage already has an APK."; exit 0; fi
          git fetch --quiet --unshallow origin || true
          commit=$(git log --all --format=%H --diff-filter=A -- 'public/downloads/*.apk' | head -1)
          path=$(git show --name-only --format= "$commit" -- 'public/downloads/*.apk' | head -1)
          [ -n "$path" ] || { echo "::warning::No APK in Storage and none in git history; upload one in Admin -> Releases."; exit 0; }
          name=$(basename "$path")
          git show "$commit:$path" > "$name"
          gcloud storage cp "$name" "gs://$BUCKET/releases/$name" \
            --content-type=application/vnd.android.package-archive \
            --content-disposition="attachment; filename=\"$name\"" --cache-control="public, max-age=86400"
          echo "Uploaded $name to releases/."
      - name: Deploy Hosting (live)
        if: github.event_name != 'pull_request'
        run: npx firebase deploy --only hosting --project "$FIREBASE_PROJECT" --non-interactive --message "GitHub ${GITHUB_SHA::7}"
      - name: Smoke test website
        if: github.event_name != 'pull_request'
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o page.html -w "%{http_code}" "$SITE_URL/?smoke=${GITHUB_SHA::7}") || true
            if [ "$code" = "200" ] && grep -q '<div id="root">' page.html && grep -q '<title>FitMe' page.html; then
              echo "Website OK: $SITE_URL"; echo "### Website live: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            echo "Attempt $i: HTTP $code"; sleep 10
          done
          echo "::error::$SITE_URL did not return the app shell"; exit 1
      - name: Render check (live site, real browser, CSP and service worker)
        if: github.event_name != 'pull_request'
        run: node e2e/render-check.cjs "$SITE_URL"

  firestore:
    name: Firestore rules and indexes
    needs: [verify, changes]
    if: github.event_name != 'pull_request' && needs.changes.outputs.firestore == 'true'
    runs-on: ubuntu-latest
    environment: dev
    env:
      HAS_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - *auth_sa
      - *auth_wif
      - run: npx firebase deploy --only firestore:rules,firestore:indexes --project "$FIREBASE_PROJECT" --non-interactive

  storage:
    name: Storage rules
    needs: [verify, changes, firestore]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.verify.result == 'success' && needs.changes.outputs.storage == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      HAS_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - *auth_sa
      - *auth_wif
      - run: npx firebase deploy --only storage --project "$FIREBASE_PROJECT" --non-interactive

  # Artifact Registry clean-up policy for function images (keep 1 day). Also runs inside every functions deploy;
  # this job applies it when only the workflow changed, without redeploying any function.
  artifacts:
    name: Function image clean-up policy
    needs: [verify, changes]
    if: ${{ github.event_name != 'pull_request' && (needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      HAS_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - *auth_sa
      - *auth_wif
      - run: npx firebase functions:artifacts:setpolicy --location asia-south1 --days 1 --force --project "$FIREBASE_PROJECT" --non-interactive

  functions:
    name: Cloud Functions
    needs: [verify, changes, storage]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.verify.result == 'success' && needs.changes.outputs.functions != '' }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      HAS_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: functions/package-lock.json }
      - run: npm ci --prefix functions
      - run: npm run lint --prefix functions
      - run: npm test --prefix functions
      - run: npm ci
      - *auth_sa
      - *auth_wif
      # --force lets the CLI set the Artifact Registry clean-up policy for function images (avoids storage cost).
      # Scheduled functions (trial reminders) create Cloud Scheduler jobs, which need roles/cloudscheduler.admin on
      # the deploy account. Until the owner grants it and sets the repository variable ENABLE_SCHEDULED_FUNCTIONS
      # to "true" (docs/DEPLOY.md), deploy every other function by name so Cloud Scheduler is never touched.
      - name: Deploy functions
        env:
          SCHEDULED: ${{ vars.ENABLE_SCHEDULED_FUNCTIONS == 'true' && 'on' || 'off' }}
          CHANGED: ${{ needs.changes.outputs.functions }}
        run: |
          if [ "$SCHEDULED" = "on" ]; then
            npx firebase deploy --only functions --project "$FIREBASE_PROJECT" --non-interactive --force
          else
            npm run build --prefix functions
            # One function at a time with retries: deploying all at once exceeds the project's regional
            # Cloud Run CPU quota (each function is its own service).
            ALL_NAMES=$(cd functions && SCHEDULED_FUNCTIONS=off node -e "console.log(Object.keys(require('./lib/index.js')).join(' '))")
            if [ "$CHANGED" = "ALL" ]; then NAMES="$ALL_NAMES"; else NAMES=$(for f in $CHANGED; do echo " $ALL_NAMES " | grep -q " $f " && echo $f; done); fi
            echo "Deploying only: $NAMES"
            FAILED=""
            for f in $NAMES; do
              ok=0
              for try in 1 2 3; do
                if SCHEDULED_FUNCTIONS=off npx firebase deploy --only "functions:$f" --project "$FIREBASE_PROJECT" --non-interactive --force; then ok=1; break; fi
                sleep 30
              done
              [ $ok = 1 ] || FAILED="$FAILED $f"
            done
            if [ -n "$FAILED" ]; then echo "::error::Functions not deployed:$FAILED"; exit 1; fi
          fi
      - name: Keep only recent function images (Artifact Registry clean-up, 1 day)
        run: npx firebase functions:artifacts:setpolicy --location asia-south1 --days 1 --force --project "$FIREBASE_PROJECT" --non-interactive
      - name: Smoke test healthCheck
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf "$HEALTH_URL" | grep -q '"ok":true'; then echo "healthCheck OK"; exit 0; fi
            echo "Attempt $i failed"; sleep 15
          done
          echo "::error::healthCheck did not respond at $HEALTH_URL"; exit 1
