name: iOS TestFlight

# Builds the Capacitor iOS app (bundle com.sindulis.fitmeai, HealthKit + push) on macOS and uploads it to
# TestFlight with fastlane (ios/App/fastlane/Fastfile). Run it from Actions -> iOS TestFlight -> Run workflow.
# Every secret listed below must exist (Settings -> Secrets and variables -> Actions); the first step stops with
# a clear list if any is missing. Steps to create them: docs/IOS_TESTFLIGHT.md.

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: What is new (shown to testers)
        default: Bug fixes and improvements.

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    environment: ios
    env:
      IOS_BUNDLE_ID: com.sindulis.fitmeai
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
      IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
      TESTFLIGHT_CHANGELOG: ${{ inputs.changelog }}
    steps:
      - name: Check the Apple secrets
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 IOS_PROFILE_NAME IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROFILE_BASE64 IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. See docs/IOS_TESTFLIGHT.md."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Web config for dev (fit-me1)
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
        run: node deploy/write-web-env.mjs dev
      - name: Build the web app for the App Store build
        env:
          VITE_DISTRIBUTION: appstore
        run: npm run build
      - run: npx cap sync ios

      - name: Firebase config for iOS (GoogleService-Info.plist)
        env:
          PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: echo "$PLIST" | base64 --decode > ios/App/App/GoogleService-Info.plist

      - name: Install the signing certificate and profile (temporary keychain)
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/fitme.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/fitme.mobileprovision
          rm "$RUNNER_TEMP/cert.p12"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios/App
      - name: Build and upload to TestFlight
        working-directory: ios/App
        run: |
          export APP_VERSION=$(grep -m1 versionName ../../android/app/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          bundle exec fastlane beta

      - name: Clean up the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/fitme.keychain-db" || true
