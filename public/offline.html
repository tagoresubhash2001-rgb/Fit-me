<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>FitMe - Offline</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f7f5; color: #111613; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      @media (prefers-color-scheme: dark) { body { background: #111613; color: #f5f7f5; } main { background: #171d18 !important; border-color: #2e3d31 !important; } }
      main { max-width: 360px; margin: 16px; padding: 28px; background: #fff; border: 1px solid #111613; border-radius: 20px; text-align: center; }
      img { width: 64px; height: 64px; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { margin: 0 0 20px; color: #5b616b; }
      button { height: 48px; padding: 0 24px; border: 0; border-radius: 14px; background: #1fa45b; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>You are offline</h1>
      <p>FitMe needs a connection to open for the first time on this device. Your logs are safe and will sync when you are back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
