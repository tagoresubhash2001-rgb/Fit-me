<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FitMe – For a Healthier Life.</title>
    <meta name="description" content="FitMe – For a Healthier Life. Food with macros, water, sleep, steps, weight and workouts on phone, tablet and desktop, in 10 languages." />
    <meta name="application-name" content="FitMe" />
    <meta name="theme-color" content="#F7F5EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1720" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://fit-me1.web.app/" />
    <link rel="preconnect" href="https://apis.google.com" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <style>
      /* Splash shown until the app mounts (React replaces #root's content). Static, no data. */
      .boot { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #f7f5ef; color: #0f1720; font-family: 'Inter Variable', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; padding: 24px; }
      .boot img { width: 72px; height: 72px; }
      .boot b { font-size: 34px; line-height: 1.2; font-weight: 600; }
      .boot p { margin: 0; max-width: 28rem; font-size: 16px; line-height: 1.5; color: #5b616b; }
      @media (prefers-color-scheme: dark) { .boot { background: #0f1720; color: #f7f5ef; } .boot b span { color: #1fa45b; } .boot p { color: #a9b1bb; } }
      @media (prefers-reduced-motion: no-preference) { .boot img { animation: boot 1.2s ease-in-out infinite alternate; } @keyframes boot { to { opacity: 0.6; } } }
    </style>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FitMe" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FitMe" />
    <meta property="og:title" content="FitMe – For a Healthier Life." />
    <meta property="og:description" content="FitMe – For a Healthier Life." />
    <meta property="og:url" content="https://fit-me1.web.app/" />
    <meta property="og:image" content="https://fit-me1.web.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FitMe logo and tagline" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FitMe – For a Healthier Life." />
    <meta name="twitter:description" content="FitMe – For a Healthier Life." />
    <meta name="twitter:image" content="https://fit-me1.web.app/og-image.png" />
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-busy="true">
        <img src="/favicon.svg" alt="" width="72" height="72" />
        <b>FitMe</b>
        <p>FitMe – For a Healthier Life.</p>
      </div>
    </div>
    <noscript>FitMe needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
